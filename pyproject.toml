[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "obsidian-terminal"
version = "1.0.0"
description = "Institutional-grade quantitative trading platform with ML predictions, sentiment analysis, and multi-agent pipeline"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Akhilesh Kumaravel"}
]
keywords = ["quantitative-finance", "trading", "machine-learning", "portfolio-optimization", "bloomberg-terminal"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]

[project.urls]
Homepage = "https://github.com/Akhilucky/Obsidian"
Repository = "https://github.com/Akhilucky/Obsidian"
Issues = "https://github.com/Akhilucky/Obsidian/issues"

[tool.setuptools.packages.find]
include = ["core*", "agents*", "dashboard*", "strategies*", "analytics*", "data*", "portfolio*", "research*", "signals*", "feature_store*", "execution*", "data_warehouse*"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
