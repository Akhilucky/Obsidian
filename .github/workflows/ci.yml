name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install native toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ openjdk-17-jdk-headless
      - name: Build C++ and Java cores
        run: |
          bash cpp/build.sh
          javac -d java/build java/PortfolioOptimizer.java
      - name: Compile check
        run: |
          python -m py_compile agents/*.py analytics/*.py core/*.py data/*.py \
            execution/*.py portfolio/*.py research/*.py strategies/*.py \
            dashboard/*.py run.py
      - name: Run tests
        run: pytest tests/ -v
